<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">INSO Leo AI 团队与模块架构</title>
  <desc id="desc">Human Owner 管理 CEO / Architecture Chat。直属职能机构为 Architecture Codex、Requirements / Browser-Recon Codex、Utility Codex。模块机构为 Research Module Chat、Sheets Module Chat、Workflow Module Chat、INSO Module Chat、Quotation Module Chat，各自管理 Research Module Codex、Sheets Module Codex、Workflow Module Codex、INSO Module Codex、Quotation Module Codex 和对应代码模块。Core 是当前不设常驻 Core Chat / Core Codex 的公共能力模块。</desc>
  <metadata>Source: docs/diagrams/ai-team-architecture.mmd. Update both files when team or module architecture changes.</metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 600; }
      .subtitle { font-size: 15px; fill: #586579; }
      .node-title { font-size: 17px; font-weight: 600; text-anchor: middle; }
      .node-sub { font-size: 14px; text-anchor: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #9a6b18; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .edge-label { font-size: 13px; fill: #76500f; text-anchor: middle; }
      .owner { fill: #16324f; stroke: #16324f; stroke-width: 2; }
      .ceo { fill: #334e9e; stroke: #334e9e; stroke-width: 2; }
      .staff { fill: #e8eef8; stroke: #7b8ba8; stroke-width: 1.5; }
      .chat { fill: #dce9f7; stroke: #4d78a8; stroke-width: 1.5; }
      .codex { fill: #f1f4f8; stroke: #8b98aa; stroke-width: 1.5; }
      .module { fill: #e2f2e8; stroke: #52936a; stroke-width: 1.5; }
      .core { fill: #fff0cf; stroke: #ba8526; stroke-width: 2; }
      .light { fill: #ffffff; }
      .group-label { font-size: 15px; font-weight: 600; fill: #42526a; }
      .group-line { stroke: #c6cfdb; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#ffffff"/>
  <text x="60" y="52" class="title">INSO Leo AI 团队 / 模块架构</text>
  <text x="60" y="80" class="subtitle">组织关系由 AI_TEAM.md 定义；模块与正式角色名称由 MODULE_INDEX.md 定义</text>

  <!-- Top leadership -->
  <path class="edge" d="M800 150 V188"/>
  <rect class="owner" x="610" y="100" width="380" height="50" rx="10"/>
  <text class="node-title light" x="800" y="130">Human Owner</text>

  <rect class="ceo" x="550" y="190" width="500" height="70" rx="12"/>
  <text class="node-title light" x="800" y="220">CEO / Architecture Chat</text>
  <text class="node-sub light" x="800" y="244">架构 · 跨模块决策 · 总体协调</text>

  <!-- CEO direct staff -->
  <text x="60" y="310" class="group-label">CEO 直属职能机构</text>
  <line x1="60" y1="320" x2="1540" y2="320" class="group-line"/>
  <path class="edge" d="M800 260 V338 H260 V365"/>
  <path class="edge" d="M800 260 V338 H800 V365"/>
  <path class="edge" d="M800 260 V338 H1340 V365"/>

  <rect class="staff" x="90" y="365" width="340" height="62" rx="10"/>
  <text class="node-title" x="260" y="402">Architecture Codex</text>

  <rect class="staff" x="580" y="365" width="440" height="62" rx="10"/>
  <text class="node-title" x="800" y="392">Requirements / Browser-Recon</text>
  <text class="node-sub" x="800" y="414">Codex</text>

  <rect class="staff" x="1170" y="365" width="340" height="62" rx="10"/>
  <text class="node-title" x="1340" y="402">Utility Codex</text>

  <!-- Module institutions -->
  <text x="60" y="490" class="group-label">CEO 直属模块机构</text>
  <line x1="60" y1="500" x2="1540" y2="500" class="group-line"/>
  <path class="edge" d="M800 260 V470 H170 V530"/>
  <path class="edge" d="M800 260 V470 H485 V530"/>
  <path class="edge" d="M800 260 V470 H800 V530"/>
  <path class="edge" d="M800 260 V470 H1115 V530"/>
  <path class="edge" d="M800 260 V470 H1430 V530"/>

  <!-- Research lane -->
  <rect class="chat" x="55" y="530" width="230" height="60" rx="9"/>
  <text class="node-title" x="170" y="566">Research Module Chat</text>
  <path class="edge" d="M170 590 V625"/>
  <rect class="codex" x="55" y="625" width="230" height="60" rx="9"/>
  <text class="node-title" x="170" y="650">Research Module</text>
  <text class="node-sub" x="170" y="672">Codex</text>
  <path class="edge" d="M170 685 V720"/>
  <rect class="module" x="55" y="720" width="230" height="68" rx="9"/>
  <text class="node-sub" x="170" y="747">代码模块</text>
  <text class="node-title" x="170" y="772">research</text>

  <!-- Sheets lane -->
  <rect class="chat" x="370" y="530" width="230" height="60" rx="9"/>
  <text class="node-title" x="485" y="566">Sheets Module Chat</text>
  <path class="edge" d="M485 590 V625"/>
  <rect class="codex" x="370" y="625" width="230" height="60" rx="9"/>
  <text class="node-title" x="485" y="650">Sheets Module</text>
  <text class="node-sub" x="485" y="672">Codex</text>
  <path class="edge" d="M485 685 V720"/>
  <rect class="module" x="370" y="720" width="230" height="68" rx="9"/>
  <text class="node-sub" x="485" y="747">代码模块</text>
  <text class="node-title" x="485" y="772">sheets</text>

  <!-- Workflow lane -->
  <rect class="chat" x="685" y="530" width="230" height="60" rx="9"/>
  <text class="node-title" x="800" y="566">Workflow Module Chat</text>
  <path class="edge" d="M800 590 V625"/>
  <rect class="codex" x="685" y="625" width="230" height="60" rx="9"/>
  <text class="node-title" x="800" y="650">Workflow Module</text>
  <text class="node-sub" x="800" y="672">Codex</text>
  <path class="edge" d="M800 685 V720"/>
  <rect class="module" x="685" y="720" width="230" height="68" rx="9"/>
  <text class="node-sub" x="800" y="747">代码模块</text>
  <text class="node-title" x="800" y="772">workflow</text>

  <!-- INSO lane -->
  <rect class="chat" x="1000" y="530" width="230" height="60" rx="9"/>
  <text class="node-title" x="1115" y="566">INSO Module Chat</text>
  <path class="edge" d="M1115 590 V625"/>
  <rect class="codex" x="1000" y="625" width="230" height="60" rx="9"/>
  <text class="node-title" x="1115" y="650">INSO Module</text>
  <text class="node-sub" x="1115" y="672">Codex</text>
  <path class="edge" d="M1115 685 V720"/>
  <rect class="module" x="1000" y="720" width="230" height="68" rx="9"/>
  <text class="node-sub" x="1115" y="747">代码模块</text>
  <text class="node-title" x="1115" y="772">inso</text>

  <!-- Quotation lane -->
  <rect class="chat" x="1315" y="530" width="230" height="60" rx="9"/>
  <text class="node-title" x="1430" y="566">Quotation Module Chat</text>
  <path class="edge" d="M1430 590 V625"/>
  <rect class="codex" x="1315" y="625" width="230" height="60" rx="9"/>
  <text class="node-title" x="1430" y="650">Quotation Module</text>
  <text class="node-sub" x="1430" y="672">Codex</text>
  <path class="edge" d="M1430 685 V720"/>
  <rect class="module" x="1315" y="720" width="230" height="68" rx="9"/>
  <text class="node-sub" x="1430" y="747">代码模块</text>
  <text class="node-title" x="1430" y="772">quotation</text>

  <!-- Core special case -->
  <text x="60" y="850" class="group-label">公共能力模块（无常驻 AI 机构）</text>
  <line x1="60" y1="860" x2="1540" y2="860" class="group-line"/>
  <path class="edge-dashed" d="M260 427 H25 V952 H510"/>
  <path class="edge-dashed" d="M1340 427 H1575 V952 H1090"/>
  <text class="edge-label" x="270" y="940">CEO 视具体 Task 分配</text>
  <text class="edge-label" x="1330" y="940">CEO 视具体 Task 分配</text>
  <rect class="core" x="510" y="885" width="580" height="135" rx="12"/>
  <text class="node-title" x="800" y="922">代码 / 公共能力模块：core</text>
  <text class="node-sub" x="800" y="953">当前不设常驻 Core Chat / Core Codex</text>
  <text class="node-sub" x="800" y="980">由 CEO 按任务分配 Architecture Codex 或 Utility Codex 处理</text>
</svg>
